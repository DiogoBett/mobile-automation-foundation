name: Quick Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Java / Maven Check
        uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify dependencies, compilation, and formatting
        run: mvn --batch-mode --no-transfer-progress -DskipTests verify
